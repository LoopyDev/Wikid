# Dev overrides: publishes the databases and MinIO on the host so the API, collab
# server and web app can run from source with `npm run ...`, and adds imgproxy.
# Enabled by COMPOSE_FILE in .env (see .env.example), or pass both files with -f.
# Don't use this on a server: it exposes Postgres and MinIO with default passwords.
services:
  db:
    ports:
      - "5435:5432"

  compliance-db:
    ports:
      - "5436:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  compliance-minio:
    ports:
      - "9002:9000"
      - "9003:9003"

  imgproxy:
    image: darthsim/imgproxy:v3.30.0
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: ${S3_REGION:-us-east-1}
      IMGPROXY_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      IMGPROXY_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      IMGPROXY_S3_BUCKET: ${S3_BUCKET:-wikid}
      IMGPROXY_S3_USE_SSL: "false"
      IMGPROXY_S3_FORCE_PATH_STYLE: "true"
    ports:
      - "8081:8080"
    depends_on:
      - minio
