name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code; nothing in CI needs to write to the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PDF export uses the system Chromium in Docker; CI only type-checks the API
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # A pull request that only changes docs (Markdown files, docs/, the licence) skips the checks
  # below: they're required to merge, and a skipped job counts as passed, so it can go in at once.
  # Pushes to main always run them.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(git diff --name-only "$BASE" HEAD | grep -v -E '(^docs/|^LICENSE$|\.md$)' || true)
          if [ -n "$others" ]; then
            echo "Changed besides docs:"; echo "$others"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed: skipping the checks"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Type-check, test and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Generate Prisma clients
        working-directory: api
        run: |
          npx prisma generate --generator client
          npx prisma generate --config prisma.compliance.config.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images, API and browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Usually about 15 minutes; a hung run would otherwise block its PR for up to 6 hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.yml build
      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d --wait
        env:
          # A placeholder so AI counts as set up and its on/off switches are tested; no test calls the AI.
          ANTHROPIC_API_KEY: not-a-real-key
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: API tests
        run: npm run test:api
      # Installing the browser's system libraries with apt took anywhere from 20 seconds to 12 minutes,
      # depending on Ubuntu's mirrors. The browser itself is cached per Playwright version, and the
      # libraries (which GitHub's Ubuntu runners mostly have already) are only installed if it can't start.
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser for the browser tests
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser for the browser tests
        run: |
          npx playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            echo "Chromium can't start yet; installing its system libraries"
            npx playwright install-deps chromium
          fi
      - name: Browser tests
        run: npm run test:e2e
      # Last, as restoring replaces the whole stack's data
      - name: Backup and restore
        run: npm run test:restore
      - name: Browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: API logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs api collab
