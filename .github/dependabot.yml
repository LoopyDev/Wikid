# Dependabot: keeps dependencies current with a few grouped PRs a week instead of one per package.
# Security fixes still come straight away (grouped the same way); this file sets how they're bundled.
version: 2
updates:
  - package-ecosystem: npm
    # The root lockfile covers every workspace (api, collab, web, mcp)
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Tiptap's packages must all be on the same version, so they always move together. The root
      # package.json pins some of them in "overrides"; a Tiptap PR has to update those to match.
      tiptap:
        applies-to: version-updates
        patterns: ["@tiptap/*"]
      tiptap-security:
        applies-to: security-updates
        patterns: ["@tiptap/*"]
      # Hocuspocus (the collaboration server and its client) also has to move as a whole, majors included
      hocuspocus:
        applies-to: version-updates
        patterns: ["@hocuspocus/*"]
      hocuspocus-security:
        applies-to: security-updates
        patterns: ["@hocuspocus/*"]
      # Everything else that shouldn't break anything, in one weekly PR. Major versions still come
      # one PR each, since they usually need code changes.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    # NestJS 12 is ESM-only and the API is CommonJS, so it needs converting first; that's tracked as a
    # GitHub issue. NestJS 11 is still maintained, and security fixes come through regardless.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # Base images (node, nginx). Updates within a tag (security fixes) come from rebuilding with
  # --pull; this proposes new tags.
  - package-ecosystem: docker
    directories: [/docker/api, /docker/web, /docker/collab]
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
